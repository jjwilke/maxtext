# model config for gpt3-6b

base_emb_dim: 2048
base_num_query_heads: 24
base_num_kv_heads: 24
base_mlp_dim: 2048
base_num_decoder_layers: 24
head_dim: 128
max_target_length: 1024
trainable_position_size: 16384
mlp_activations: ["gelu"]
vocab_size: 32768
enable_dropout: False
logits_via_embedding: True
normalize_embedding_logits: False
logits_dot_in_fp32: False
normalization_layer_epsilon: 1.e-05
use_iota_embed: True
fused_qkv: True
opt_type: "adam_pax"
decoder_block: "gpt3"
#dataset_path: "gs://mlperf-llm-public2"
#dataset_name: "c4/en:3.0.4"
#eval_dataset_name: "c4/en:3.0.5"
dataset_type: hf
hf_path: '/home/jwilke/Programs/workspaces/realm-jax-refactor/workflows-update/maxtext/wikitext'
hf_data_dir: 'wikitext-103-v1'
hf_train_files: '/home/jwilke/Programs/workspaces/realm-jax-refactor/workflows-update/maxtext/wikitext/wikitext-103-v1/train*.parquet'
# set eval_interval > 0 to use the specified eval dataset, otherwise, only metrics on the train set will be calculated.
eval_interval: 10000
hf_eval_split: 'validation'
hf_eval_files: ''
# for HF pipeline, tokenizer_path can be a path in HuggingFace Hub,
# or a local path containing tokenizer in a format supported by transformers.AutoTokenizer
tokenizer_path: 'google-t5/t5-large'  # for using https://huggingface.co/google-t5/t5-large
hf_access_token: ''  # provide token if using gated dataset or tokenizer
gradient_clipping_threshold: 1.
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.e-8
adam_weight_decay: 0.1
